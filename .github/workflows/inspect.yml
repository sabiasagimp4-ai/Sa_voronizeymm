name: Inspect

# 一時的な調査用ワークフロー。YMM4のプラグイン基底クラスとD2Dシェーダーヘルパーの
# 実際の定義をログに出力します。

on:
  push:
    branches: ['claude/**']

jobs:
  inspect:
    runs-on: windows-latest
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Fetch YMM4
        shell: pwsh
        run: |
          Invoke-WebRequest 'https://object-storage.tyo1.conoha.io/v1/nc_4fac3ef0e6d843249e0ab2f1fc3e8f85/public/YukkuriMovieMaker_v4_Lite.zip' -OutFile ymm4.zip
          Expand-Archive ymm4.zip -DestinationPath ymm4 -Force
          $plugin = Get-ChildItem ymm4 -Recurse -Filter 'YukkuriMovieMaker.Plugin.dll' | Select-Object -First 1
          "YMM4_DIR=$($plugin.Directory.FullName)" >> $env:GITHUB_ENV
          Get-ChildItem $plugin.Directory.FullName -Filter 'YukkuriMovieMaker*.dll' | ForEach-Object { $_.Name }
          Get-ChildItem $plugin.Directory.FullName -Filter 'Vortice*.dll' | ForEach-Object { "$($_.Name) $($_.VersionInfo.FileVersion)" }

      - name: Inspect plugin API
        shell: pwsh
        env:
          DOTNET_ROLL_FORWARD: Major
        run: |
          dotnet tool install -g ilspycmd | Out-Null
          $dir = $env:YMM4_DIR
          $plugin = Join-Path $dir 'YukkuriMovieMaker.Plugin.dll'
          foreach ($t in 'YukkuriMovieMaker.Controls.ColorPickerAttribute', 'YukkuriMovieMaker.Controls.ToggleSliderAttribute', 'YukkuriMovieMaker.Controls.TextBoxSliderAttribute', 'YukkuriMovieMaker.ItemEditor.CustomVisibilityAttributes.ShowPropertyEditorWhenAttribute', 'YukkuriMovieMaker.Controls.AnimationSliderAttribute', 'YukkuriMovieMaker.Plugin.Effects.VideoEffectAttribute') {
            "===== $t"
            ilspycmd -r $dir -t $t $plugin | Select-String -Pattern 'public |class ' | ForEach-Object { $_.Line }
          }
          ilspycmd -r $dir -p -o community (Join-Path $dir 'YukkuriMovieMaker.Plugin.Community.dll') | Out-Null
          "===== community usages"
          Get-ChildItem community -Recurse -Filter *.cs | Select-String -Pattern 'GroupName|ColorPicker|ShowPropertyEditorWhen|ToggleSlider|System.Windows.Media.Color ' |
            Select-Object -First 80 | ForEach-Object { "$($_.Filename):$($_.LineNumber): $($_.Line.Trim())" }
